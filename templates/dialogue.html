<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token }}"><title>LiveAct 语音对话</title>
<style>
body{margin:0;background:#f5f7fa;color:#1d2939;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:28px 20px}section{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:22px;margin:18px 0}h1{margin-bottom:8px}p{line-height:1.7}.hint{color:#667085;font-size:14px}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}button,select{font:inherit;border:1px solid #d0d5dd;border-radius:9px;padding:11px 15px}button{background:#fff;cursor:pointer}button.primary{background:#5046e5;color:white;border-color:#5046e5}button:disabled{opacity:.45;cursor:default}#interrupt{color:#b42318}#status{font-weight:600}#error{color:#b42318;white-space:pre-wrap}article{border-top:1px solid #eee;padding:12px 0}article p{margin:5px 0;white-space:pre-wrap}pre{white-space:pre-wrap;font:14px ui-monospace,monospace}meter{width:150px}label{display:inline-flex;gap:8px;align-items:center}
</style></head>
<body><main><h1>LiveAct 语音对话</h1>
<p>点击开始录音，说完点击结束；回答会边生成边播放。默认女声 <strong>{{ default_voice }}</strong>。</p>
<p class="hint">当前开放语音对话试用，人物画面将在后续接入。每次录音与回答最多 15 秒；建议戴耳机，避免扬声器回声。</p>
<section><div class="controls">
<button id="connect" class="primary">连接并启用音频</button>
<label>女声<select id="voice">{% for voice in voices %}<option value="{{ voice.id }}" {% if voice.id == default_voice %}selected{% endif %}>{{ voice.id }}</option>{% endfor %}</select></label>
<label><input type="checkbox" id="vad">自动结束（静音约 1 秒）</label>
</div><p id="status" role="status" aria-live="polite">等待连接</p>
<div class="controls"><button id="record" class="primary" disabled>开始录音</button><button id="end" disabled>结束录音</button><button id="interrupt" disabled>打断回答</button><button id="disconnect" disabled>断开</button><meter id="level" min="0" max="0.15" value="0"></meter><span id="record-time"></span></div>
<p id="error" role="alert"></p><button id="recover">恢复语音服务（清空上下文）</button>
</section>
<section><h2>对话记录</h2><div id="history"></div></section>
<section><h2>本次测量</h2><p class="hint">首声音从结束录音开始计时；后台切换和打断单独记录。完成确认以实际播放结束为准。</p><pre id="metrics">尚无测量</pre><button id="download">下载测量记录</button></section>
</main><script src="/static/dialogue.js" defer></script></body></html>
